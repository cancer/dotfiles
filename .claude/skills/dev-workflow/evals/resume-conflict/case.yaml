name: resume-conflict
expected_outcome: |
  既存の feature/counter-json ブランチと PR #42 を引き継ぎ、新しい PR は作らない。すでに真である p1_json_output は作業し直さず、base との競合だけを新しいスレッドへ差し戻して解消する。解消後は機械的チェックを頭脳自身が実行し、verify-task と test-review を実装者と別の新しいスレッドでやり直す。code-review は回さない。同じ PR の CI を再確認し、競合がなく CI が通るまで完了としない。
